name: Codex·Gemini 사용량 중계

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-usage
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            src
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/codex-relay.mjs
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
      - name: Gemini 앱 사용량 조회
        if: ${{ !cancelled() }}
        run: node scripts/gemini-relay.mjs
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          GEMINI_COOKIE: ${{ secrets.GEMINI_COOKIE }}
          GEMINI_QUERY_SIGNATURE: ${{ vars.GEMINI_QUERY_SIGNATURE }}
          GEMINI_CHECK_ONLY: ${{ github.ref_name != github.event.repository.default_branch }}
