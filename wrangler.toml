name = "usage-check"
main = "src/index.js"
compatibility_date = "2026-09-01"

# KV에 로그인 토큰과 마지막 사용량을 저장합니다.
# id를 비워두면 첫 배포 때 Cloudflare가 자동으로 만들어 연결합니다.
[[kv_namespaces]]
binding = "KV"

# 로그인 토큰 저장소. 갱신을 한 번에 하나씩 처리해서 로그인이 풀리지 않게 해요.
[[durable_objects.bindings]]
name = "TOKENS"
class_name = "TokenStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenStore"]

# 15분마다 사용량을 자동으로 갱신합니다.
[triggers]
crons = ["*/15 * * * *"]

# 비밀값(DASHBOARD_PASSWORD, RELAY_SECRET, 선택: GITHUB_TOKEN)은 Cloudflare Secret으로 등록해요.
# 목록은 .dev.vars.example에 있어요. README의 설치 방법을 참고하세요.
